# infrastructure/docker/docker-compose.yml

version: '3.8'

services:
  # Video Streaming Server
  video-server:
    build:
      context: ../..
      dockerfile: infrastructure/docker/server/Dockerfile
    container_name: video-streaming-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379
    env_file:
      - ../../server/.env
    volumes:
      - ../../server:/app
      - /app/node_modules
      - logs:/app/logs
    networks:
      - streaming-network
    depends_on:
      - redis
    command: npm run dev

  # Redis for session management and caching
  redis:
    image: redis:7-alpine
    container_name: video-streaming-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - streaming-network
    command: redis-server --appendonly yes

  # Nginx reverse proxy (optional)
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: video-streaming-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - streaming-network
    depends_on:
      - video-server

  # Monitoring - Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: video-streaming-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - streaming-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Monitoring - Grafana (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: video-streaming-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - streaming-network
    depends_on:
      - prometheus

volumes:
  logs:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  streaming-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16