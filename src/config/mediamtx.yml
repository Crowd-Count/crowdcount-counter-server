# MediaMTX Configuration for CrowdCount Counter Server
# Documentation: https://github.com/bluenviron/mediamtx

# General settings
logLevel: info
logDestinations: [stdout]
logFile: data/mediamtx.log

# API server for monitoring and management
api: true
apiAddress: 127.0.0.1:9997

# Metrics for monitoring
metrics: true
metricsAddress: 127.0.0.1:9998

# Performance settings - optimized for 30fps streaming
readTimeout: 10s
writeTimeout: 10s
readBufferCount: 2048  # Increased from 512 for better buffering at 30fps
writeBufferCount: 2048
udpMaxPayloadSize: 1472
rtpMaxPayloadSize: 1460

# RTSP Server Configuration
rtspDisable: false
protocols: [tcp]  # TCP only for reliability over Tailscale
encryption: "no"
rtspAddress: :8554
rtspsAddress: :8555
rtpAddress: :8000
rtcpAddress: :8001

# RTSP-specific optimizations for 30fps
rtspReadBufferSize: 8192
rtspWriteBufferSize: 8192

# RTMP Server Configuration (for camera publishing)
rtmpDisable: false
rtmpAddress: :1935
rtmpEncryption: "no"

# HLS (for browser viewing)
hlsDisable: false
hlsAddress: :8888
hlsEncryption: false
hlsAllowOrigin: '*'
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

# WebRTC (for low-latency browser viewing)
webrtcDisable: false
webrtcAddress: :8889
webrtcICEServers: []
webrtcAllowOrigin: '*'

# Recording settings (disabled by default, can enable per-path)
recordPath: ./data/recordings/%path/%Y-%m-%d_%H-%M-%S-%f

# Path configurations (streams)
paths:
  # Catch-all regex pattern to match any stream name
  ~^.*$:
    source: publisher
    # Allow any Raspberry Pi to publish
    publishUser:
    publishPass:
    publishIPs: []

    # Allow anyone to read (we'll secure this at the network level with Tailscale)
    readUser:
    readPass:
    readIPs: []

    # Run a command when a stream is ready (used to notify our orchestrator)
    runOnReady: 'curl -X POST http://127.0.0.1:5000/stream/ready -H "Content-Type: application/json" -d "{\"stream\":\"$MTX_PATH\"}"'
    runOnReadyRestart: false

    # Run a command when a stream is not ready anymore
    runOnNotReady: 'curl -X POST http://127.0.0.1:5000/stream/stopped -H "Content-Type: application/json" -d "{\"stream\":\"$MTX_PATH\"}"'

    # Recording (disabled by default)
    record: false

  # Example: Specific path configurations can be added here
  # camera1:
  #   source: publisher
  #   record: yes
  #   recordFormat: mp4
