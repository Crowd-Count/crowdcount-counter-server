<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrowdCount Streams - DEV</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="env-banner dev">DEVELOPMENT</div>

    <div class="app">
        <header class="header">
            <h1>CrowdCount</h1>
            <p class="subtitle">Stream Viewer</p>
        </header>

        <main class="main">
            <div class="status-bar">
                <div class="server-info" id="serverInfo">
                    <span class="loading-dot"></span> Connecting...
                </div>
                <div class="refresh-info">
                    <button class="btn-icon" onclick="refreshStreams()" title="Refresh">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
                        </svg>
                    </button>
                    <span class="countdown-text">Auto refresh: <span id="countdown">10</span>s</span>
                </div>
            </div>

            <div class="streams-container" id="streamsContainer">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading streams...</p>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>CrowdCount Counter Server</p>
        </footer>
    </div>

    <script>
        let streams = [];
        let refreshInterval;
        let countdownInterval;
        let countdown = 10;

        document.addEventListener('DOMContentLoaded', () => {
            loadServerInfo();
            loadStreams();
            startAutoRefresh();
        });

        async function loadServerInfo() {
            try {
                const response = await fetch('/api/server/info');
                const data = await response.json();
                document.getElementById('serverInfo').innerHTML = `
                    <span class="info-item"><strong>IP:</strong> ${data.tailscale_ip}</span>
                    <span class="info-item"><strong>RTSP:</strong> ${data.rtsp_port}</span>
                    <span class="info-item"><strong>API:</strong> ${data.orchestrator_port}</span>
                `;
            } catch (error) {
                document.getElementById('serverInfo').innerHTML = '<span class="error">Failed to connect</span>';
            }
        }

        async function loadStreams() {
            try {
                const response = await fetch('/status');
                const data = await response.json();
                streams = data.active_streams || [];
                renderStreams(data);
            } catch (error) {
                document.getElementById('streamsContainer').innerHTML = `
                    <div class="error-state">
                        <p>Failed to load streams</p>
                        <button class="btn btn-primary" onclick="loadStreams()">Retry</button>
                    </div>
                `;
            }
        }

        function renderStreams(statusData) {
            const container = document.getElementById('streamsContainer');

            if (!streams || streams.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="2" y="3" width="20" height="14" rx="2"/>
                            <path d="M8 21h8M12 17v4"/>
                        </svg>
                        <h2>No Active Streams</h2>
                        <p>Streams will appear here when cameras connect</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="streams-grid">
                    ${streams.map(streamName => renderStreamCard(streamName, statusData)).join('')}
                </div>
            `;
        }

        function renderStreamCard(streamName, statusData) {
            const deviceInfo = statusData.device_info?.[streamName] || {};
            const deviceId = deviceInfo.device_id || streamName;

            return `
                <div class="stream-card">
                    <div class="stream-header">
                        <div class="stream-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M23 7l-7 5 7 5V7z"/>
                                <rect x="1" y="5" width="15" height="14" rx="2"/>
                            </svg>
                        </div>
                        <div class="stream-info">
                            <h3 class="stream-name">${deviceId}</h3>
                            <span class="stream-id">${streamName}</span>
                        </div>
                        <span class="status-dot active"></span>
                    </div>
                    <button class="btn btn-primary btn-block" onclick="viewStream('${streamName}')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <polygon points="10,8 16,12 10,16" fill="currentColor"/>
                        </svg>
                        View Stream
                    </button>
                </div>
            `;
        }

        function viewStream(streamName) {
            window.open(`/view/${streamName}`, '_blank', 'width=1280,height=800');
        }

        function refreshStreams() {
            loadStreams();
            resetCountdown();
        }

        function startAutoRefresh() {
            refreshInterval = setInterval(loadStreams, 10000);
            countdownInterval = setInterval(() => {
                countdown -= 1;
                if (countdown <= 0) countdown = 10;
                const el = document.getElementById('countdown');
                if (el) el.textContent = countdown;
            }, 1000);
        }

        function resetCountdown() {
            countdown = 10;
            const el = document.getElementById('countdown');
            if (el) el.textContent = countdown;
        }
    </script>
</body>
</html>
