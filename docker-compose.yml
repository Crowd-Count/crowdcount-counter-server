# CrowdCount Counter Server - Docker Compose
#
# Runs two isolated server instances:
# - Production: Uses code from code/prod/ (main branch)
# - Development: Uses code from code/dev/ (dev branch)
#
# Usage:
#   docker-compose up -d        # Start both servers
#   docker-compose up -d prod   # Start only production
#   docker-compose up -d dev    # Start only development
#   docker-compose logs -f      # View logs
#   docker-compose restart prod # Restart production after code changes

services:
  # =============================================================================
  # PRODUCTION SERVER
  # =============================================================================
  prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crowdcount-prod
    restart: unless-stopped

    # GPU access (uses GPU 1)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]

    # Mount production code (prod branch worktree)
    volumes:
      - ./prod:/app:ro
      - ./prod/data:/app/data
      - ./prod/src/config:/app/src/config      # Writable for generated mediamtx.yml
      - ./prod/bin:/app/bin                    # Writable for mediamtx symlink

    # Production ports
    environment:
      - RTSP_PORT=8554
      - ORCHESTRATOR_PORT=5000
      - HLS_PORT=8888
      - WEBRTC_PORT=8889
      - MEDIAMTX_API_PORT=9997
      - MEDIAMTX_METRICS_PORT=9998
      - RTSPS_PORT=8555
      - RTP_PORT=8000
      - RTCP_PORT=8001
      - RTMP_PORT=1935
      - ENV=production
      - TAILSCALE_IP=100.72.64.80
      # Frame buffer for jitter smoothing (stabilizes network streams to steady 15 FPS)
      - FRAME_BUFFER_ENABLED=true
      - FRAME_BUFFER_SECONDS=1.0

    ports:
      - "5000:5000"     # Flask API
      - "8554:8554"     # RTSP
      - "8888:8888"     # HLS
      - "8890:8889"     # WebRTC (mapped to 8890 on host)
      - "9997:9997"     # MediaMTX API
      - "9999:9998"     # MediaMTX Metrics (mapped to 9999 on host)

    # Use host network for Tailscale compatibility
    # Uncomment if you need direct Tailscale access:
    # network_mode: host

  # =============================================================================
  # DEVELOPMENT SERVER
  # =============================================================================
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crowdcount-dev
    restart: unless-stopped
    network_mode: host  # Direct Tailscale access - fixes RTSP routing issues

    # GPU access (uses GPU 0)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

    # Mount development code (dev branch worktree)
    volumes:
      - ./dev:/app:ro
      - ./dev/data:/app/data
      - ./dev/src/config:/app/src/config        # Writable for generated mediamtx.yml
      - ./dev/bin:/app/bin                      # Writable for mediamtx symlink

    # Development ports (host network mode - apps bind directly to these host ports)
    environment:
      - RTSP_PORT=8555          # Dev RTSP (offset from prod 8554)
      - ORCHESTRATOR_PORT=5001  # Dev Flask API (offset from prod 5000)
      - HLS_PORT=8889           # Dev HLS (offset from prod 8888)
      - WEBRTC_PORT=8891        # Dev WebRTC (offset from prod 8889)
      - MEDIAMTX_API_PORT=9998  # Dev MediaMTX API (offset from prod 9997)
      - MEDIAMTX_METRICS_PORT=10000  # Dev Metrics (offset from prod 9998)
      - RTSPS_PORT=8556         # Dev RTSPS (offset from prod 8555)
      - RTP_PORT=8002           # Dev RTP (offset from prod 8000)
      - RTCP_PORT=8003          # Dev RTCP (offset from prod 8001)
      - RTMP_PORT=1936          # Dev RTMP (offset from prod 1935)
      - ENV=development
      - TAILSCALE_IP=100.72.64.80
      # Frame buffer for jitter smoothing (stabilizes network streams to steady 15 FPS)
      - FRAME_BUFFER_ENABLED=true
      - FRAME_BUFFER_SECONDS=1.0

    # NOTE: ports section removed - network_mode: host binds directly to host ports
