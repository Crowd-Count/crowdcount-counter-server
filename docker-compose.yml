# CrowdCount Counter Server - Docker Compose
#
# Runs two isolated server instances:
# - Production: Uses code from code/prod/ (main branch)
# - Development: Uses code from code/dev/ (dev branch)
#
# Usage:
#   docker-compose up -d        # Start both servers
#   docker-compose up -d prod   # Start only production
#   docker-compose up -d dev    # Start only development
#   docker-compose logs -f      # View logs
#   docker-compose restart prod # Restart production after code changes

services:
  # =============================================================================
  # PRODUCTION SERVER
  # =============================================================================
  prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crowdcount-prod
    restart: unless-stopped

    # GPU access (uses GPU 1)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]

    # Mount production code (prod branch worktree)
    volumes:
      - ./prod:/app:ro
      - ./prod/data:/app/data
      - ./prod/src/config:/app/src/config      # Writable for generated mediamtx.yml
      - ./prod/bin:/app/bin                    # Writable for mediamtx symlink

    # Production ports
    environment:
      - RTSP_PORT=8554
      - ORCHESTRATOR_PORT=5000
      - HLS_PORT=8888
      - WEBRTC_PORT=8889
      - MEDIAMTX_API_PORT=9997
      - MEDIAMTX_METRICS_PORT=9998
      - RTSPS_PORT=8555
      - RTP_PORT=8000
      - RTCP_PORT=8001
      - RTMP_PORT=1935
      - ENV=production
      - TAILSCALE_IP=100.72.64.80
      # Frame buffer for jitter smoothing (stabilizes network streams to steady 15 FPS)
      - FRAME_BUFFER_ENABLED=true
      - FRAME_BUFFER_SECONDS=2.5

    ports:
      - "5000:5000"     # Flask API
      - "8554:8554"     # RTSP
      - "8888:8888"     # HLS
      - "8890:8889"     # WebRTC (mapped to 8890 on host)
      - "9997:9997"     # MediaMTX API
      - "9999:9998"     # MediaMTX Metrics (mapped to 9999 on host)

    # Use host network for Tailscale compatibility
    # Uncomment if you need direct Tailscale access:
    # network_mode: host

  # =============================================================================
  # DEVELOPMENT SERVER
  # =============================================================================
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crowdcount-dev
    restart: unless-stopped

    # GPU access (uses GPU 0)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

    # Mount development code (dev branch worktree)
    volumes:
      - ./dev:/app:ro
      - ./dev/data:/app/data
      - ./dev/src/config:/app/src/config        # Writable for generated mediamtx.yml
      - ./dev/bin:/app/bin                      # Writable for mediamtx symlink

    # Development ports (offset from production)
    environment:
      - RTSP_PORT=8554
      - ORCHESTRATOR_PORT=5000
      - HLS_PORT=8888
      - WEBRTC_PORT=8889
      - MEDIAMTX_API_PORT=9997
      - MEDIAMTX_METRICS_PORT=9998
      - RTSPS_PORT=8555
      - RTP_PORT=8000
      - RTCP_PORT=8001
      - RTMP_PORT=1935
      - ENV=development
      - TAILSCALE_IP=100.72.64.80
      # Frame buffer for jitter smoothing (stabilizes network streams to steady 15 FPS)
      - FRAME_BUFFER_ENABLED=true
      - FRAME_BUFFER_SECONDS=2.5

    # Development ports (offset by 1 from production on host)
    ports:
      - "5001:5000"     # Flask API
      - "8555:8554"     # RTSP
      - "8889:8888"     # HLS
      - "8891:8889"     # WebRTC
      - "9998:9997"     # MediaMTX API
      - "10000:9998"    # MediaMTX Metrics
