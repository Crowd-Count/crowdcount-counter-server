### 5. **public/index.html** (optional viewer)
```html
<!DOCTYPE html>
<html>
<head>
    <title>Video Feed Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #1a1a1a;
            color: white;
        }
        h1 { color: #4CAF50; }
        #feeds {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .feed-card {
            border: 2px solid #4CAF50;
            border-radius: 8px;
            padding: 10px;
            background: #2a2a2a;
        }
        .feed-card h3 {
            margin: 0 0 10px 0;
            color: #4CAF50;
        }
        video {
            width: 100%;
            border-radius: 4px;
        }
        #status {
            padding: 10px;
            background: #2a2a2a;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .connected { color: #4CAF50; }
        .disconnected { color: #f44336; }
    </style>
</head>
<body>
    <h1>🎥 Video Feed Viewer</h1>
    <div id="status">Status: <span id="connection-status" class="disconnected">Disconnected</span></div>
    <div id="feeds"></div>

    <script>
        const ws = new WebSocket(`ws://${window.location.host}`);
        const statusEl = document.getElementById('connection-status');
        const feedsEl = document.getElementById('feeds');
        let clientId = null;

        ws.onopen = () => {
            statusEl.textContent = 'Connected';
            statusEl.className = 'connected';
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            switch(data.type) {
                case 'connected':
                    clientId = data.clientId;
                    // Register as viewer
                    ws.send(JSON.stringify({ type: 'register-viewer' }));
                    break;
                
                case 'registered':
                    // Display available feeds
                    displayFeeds(data.feeds || []);
                    break;
                
                case 'feeds-update':
                    displayFeeds(data.feeds || []);
                    break;
            }
        };

        ws.onclose = () => {
            statusEl.textContent = 'Disconnected';
            statusEl.className = 'disconnected';
        };

        function displayFeeds(feeds) {
            feedsEl.innerHTML = '';
            
            if (feeds.length === 0) {
                feedsEl.innerHTML = '<p>No active feeds</p>';
                return;
            }

            feeds.forEach(feedId => {
                const card = document.createElement('div');
                card.className = 'feed-card';
                card.innerHTML = `
                    <h3>Feed: ${feedId}</h3>
                    <video id="video-${feedId}" autoplay controls></video>
                    <button onclick="watchFeed('${feedId}')">Watch</button>
                `;
                feedsEl.appendChild(card);
            });
        }

        function watchFeed(feedId) {
            ws.send(JSON.stringify({
                type: 'request-feed',
                feedId: feedId
            }));
        }
    </script>
</body>
</html>
