# ByteTrack configuration optimized for overhead doorway counting
# Tuned for better group detection and reduced ID switches

tracker_type: bytetrack

# Detection thresholds
track_high_thresh: 0.25    # High confidence threshold for first association (lowered for groups)
track_low_thresh: 0.15     # Low confidence threshold for second association (raised from 0.1 to reduce night noise)
new_track_thresh: 0.4      # Threshold for creating new tracks (raised from 0.3 to filter night false detections)

# Track buffer and matching
track_buffer: 22           # Frames to keep lost tracks (~1.5 sec at 15fps). Reduced from 45 to let false tracks die faster
match_thresh: 0.75         # IoU threshold for matching (relaxed for reacquisition through doorway)

# Motion model (Kalman filter)
# For overhead view, people move more uniformly
fuse_score: true           # Fuse detection score with track score
